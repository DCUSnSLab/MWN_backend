# mwn-secret 템플릿
#
# 이 파일은 'mwn-secret' Secret 의 구조만 보여주는 예시입니다.
# 실제 비밀값을 채운 파일은 절대 저장소에 커밋하지 마십시오.
#
# 적용 방법:
#   1) 이 파일을 mwn-secret.yaml 로 복사하고 아래 <...> 값을 실제 값으로 채운다.
#   2) kubectl apply -f mwn-secret.yaml
#   3) (또는) kubectl create secret generic mwn-secret -n mwn \
#        --from-literal=SECRET_KEY=... --from-literal=JWT_SECRET_KEY=... 등
#
# DATABASE_URL 의 비밀번호와 POSTGRES_PASSWORD 는 동일한 값이어야 합니다
# (backend 와 postgres 사이드카가 같은 DB 자격증명을 공유).
apiVersion: v1
kind: Secret
metadata:
  name: mwn-secret
  namespace: mwn
type: Opaque
stringData:
  # Flask 세션 서명 키 (충분히 긴 무작위 문자열)
  SECRET_KEY: "<flask-session-secret>"
  # JWT 토큰 서명 키 (SECRET_KEY 와 다른 무작위 문자열)
  JWT_SECRET_KEY: "<jwt-signing-secret>"
  # entrypoint.sh 가 생성하는 초기 관리자 계정 비밀번호
  ADMIN_PASSWORD: "<initial-admin-password>"
  # 기상청(KMA) API 인증 키
  KMA_SERVICE_KEY: "<kma-api-key>"
  # 앱이 사용하는 DB 연결 문자열 (postgres 사이드카는 localhost)
  DATABASE_URL: "postgresql://mwn_user:<db-password>@localhost:5432/mwn_db"
  # postgres 컨테이너의 superuser 비밀번호 (DATABASE_URL 의 비밀번호와 동일)
  POSTGRES_PASSWORD: "<db-password>"
